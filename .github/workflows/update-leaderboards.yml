name: Update Legacy Drive Leaderboards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

concurrency:
  group: update-legacy-drive-leaderboards
  cancel-in-progress: false

jobs:
  update-leaderboards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install nfl_data_py pandas

      - name: Run legacy drives script
        run: python legacy-drive/legacy_drives.py

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          generated_files=(
            "legacy-drive/regular_season_legacy_drives_leaderboard.html"
            "legacy-drive/post_season_legacy_drives_leaderboard.html"
            "legacy-drive/recent_legacy_drives.html"
            "legacy-drive/legacy_drives_cache.json"
            "legacy-drive/qb_name_cache.json"
          )

          for file in "${generated_files[@]}"; do
            test -f "$file" || { echo "Missing generated file: $file"; exit 1; }
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated_files[@]}"

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git status --short
          git commit -m "Update legacy drive leaderboards"
          git push
